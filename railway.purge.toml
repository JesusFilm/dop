# Railway config for the **auto-purge cron service** (§8.4, §10, #8).
#
# Railway config-as-code is per service, so the second service in the project
# cannot share `railway.toml` with the web app: it points its config path here
# instead (see README, "Auto-purge"). `railway.toml` stays the app service's
# deploy config.
#
# It runs `pnpm purge` against the database on the private network rather than
# calling an in-app HTTP route, which is what the scaffold README originally
# sketched. Reason: a route that deletes every due session's requests would be a
# destructive, internet-reachable endpoint needing its own shared secret, and
# the cron service already has `DATABASE_URL`.
#
# The schedule is only a **trigger** — the app's own clock owns the purge moment,
# exactly as it does for the reveal (§5). `pnpm purge` deletes only sessions
# whose `purgeAfter` instant has already passed, so the trigger is idempotent, a
# no-op when nothing is due, and self-heals a missed or drifted run.

[build]
builder = "NIXPACKS"
# The job needs the generated Prisma client, not the Next.js server bundle, so
# skip the app's `next build` on this service.
buildCommand = "pnpm exec prisma generate"

[deploy]
startCommand = "pnpm purge"
# Hourly, UTC. `purgeAfter` is always the top of an hour (06:00 in the session's
# zone, `PURGE_HOUR`), so an hourly trigger lands *on* the configured instant —
# 18:00 UTC in NZST, 17:00 UTC in NZDT — with no DST-specific expression, and
# every other hour of the day is a no-op sweep.
cronSchedule = "0 * * * *"
# A cron run is a one-shot job: a completed run must not be restarted, and a
# failed run is retried by the next hourly trigger rather than by a restart loop.
restartPolicyType = "NEVER"
