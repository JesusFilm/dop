# Deploy config for the **web app service**. Railway config-as-code is per
# service; the auto-purge cron service uses `railway.purge.toml`.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
