# Railway config-as-code. Railway reads railway.toml (or railway.json) from the
# service's Root Directory — keep this at the repo root and leave the service's
# Root Directory unset (defaults to repo root) so it is found.
# Schema: https://railway.app/railway.schema.json

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start"
# Health check must return 200 before a deploy is marked live. /api/health
# returns 503 until Postgres is reachable, so the Postgres plugin must be added
# and DATABASE_URL wired (${{ Postgres.DATABASE_URL }}) for the deploy to pass.
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
